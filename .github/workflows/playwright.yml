name: OrangeHRM E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Run Cucumber and Playwright tests
      run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: reports/
        if-no-files-found: error
        retention-days: 30
    - name: Email report to customer
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: node scripts/send-report-email.js
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        REPORT_FROM_EMAIL: ${{ vars.REPORT_FROM_EMAIL }}
        REPORT_RECIPIENT: craddipufeippi-8639@yopmail.com
